name: Build METATRON Desktop Windows (.exe)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versione aggiornamento (es. 1.0.9 — lascia vuoto per incremento automatico)'
        required: false
        default: ''
      publish_release:
        description: 'Pubblica su GitHub Releases per aggiornamenti automatici in-app'
        type: boolean
        default: true
      release_repo:
        description: 'Opzionale: repo Pubblico vuoto solo per Release (es. utente/metatron-releases) lasciando privato il codice'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout sorgenti
        uses: actions/checkout@v4

      - name: Verifica file desktop presenti
        shell: bash
        run: |
          if [ ! -f "desktop-app/electron-builder.json" ] || [ ! -f "scripts/build-desktop-server.mjs" ]; then
            echo "::error::Mancano i file desktop-app/ o scripts/build-desktop-server.mjs nel repository. Fai prima Push/Sincronizza da AI Studio su GitHub!"
            exit 1
          fi

      - name: Configura Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Imposta versione e repository aggiornamenti automatici
        id: meta
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_RELEASE_REPO: ${{ inputs.release_repo }}
          VAR_RELEASE_REPO: ${{ vars.RELEASE_REPO }}
          GITHUB_REPO: ${{ github.repository }}
          RUN_NUM: ${{ github.run_number }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          node -e '
            const fs = require("fs");
            let ver = (process.env.INPUT_VERSION || "").trim().replace(/^v/i, "");
            if (!ver && /^v\d+\.\d+\.\d+/.test(process.env.REF_NAME || "")) {
              ver = process.env.REF_NAME.replace(/^v/i, "");
            }
            if (!ver) {
              ver = `1.0.${process.env.RUN_NUM || "1"}`;
            }
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.version = ver;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");

            const targetRepo = (
              process.env.INPUT_RELEASE_REPO ||
              process.env.VAR_RELEASE_REPO ||
              process.env.GITHUB_REPO ||
              ""
            ).trim().replace(/^https?:\/\/github\.com\//i, "").replace(/\.git$/i, "");

            const [owner, repo] = targetRepo.split("/");
            if (owner && repo) {
              fs.writeFileSync(
                "desktop-app/update-config.json",
                JSON.stringify({ owner, repo, version: ver }, null, 2) + "\n"
              );
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${ver}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `target_repo=${targetRepo}\n`);
            console.log("Versione:", ver, "Release Repo:", targetRepo);
          '

      - name: Installa dipendenze
        run: npm install --legacy-peer-deps

      - name: Installa Electron, electron-updater e electron-builder
        run: |
          npm install --save --legacy-peer-deps electron-updater
          npm install --save-dev --legacy-peer-deps electron electron-builder

      - name: Compila frontend e motore server interno
        run: |
          npm run build
          node scripts/build-desktop-server.mjs

      - name: Genera eseguibile Windows (.exe)
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-builder --win --config desktop-app/electron-builder.json --publish never
          ls -la release/

      - name: Carica eseguibile Windows (ZIP scaricabile)
        uses: actions/upload-artifact@v4
        with:
          name: METATRON-Desktop-Windows-EXE
          path: |
            release/*.exe
          if-no-files-found: error

      - name: Pubblica GitHub Release per aggiornamenti automatici in-app
        if: ${{ github.event_name == 'push' || inputs.publish_release != false }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ steps.meta.outputs.version }}
          TARGET_REPO: ${{ steps.meta.outputs.target_repo }}
          CURRENT_REPO: ${{ github.repository }}
        run: |
          TAG="v${APP_VERSION}"
          FILES=()
          for f in release/*.exe release/*.blockmap release/latest.yml; do
            if [ -f "$f" ]; then
              FILES+=("$f")
            fi
          done
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::error::Nessun file eseguibile trovato in release/."
            exit 1
          fi
          if [ "$TARGET_REPO" != "$CURRENT_REPO" ]; then
            if gh release view "$TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then
              gh release upload "$TAG" "${FILES[@]}" --repo "$TARGET_REPO" --clobber
            else
              gh release create "$TAG" "${FILES[@]}" \
                --repo "$TARGET_REPO" \
                --title "METATRON CaricoStudio v${APP_VERSION}" \
                --notes "Versione desktop Windows METATRON CaricoStudio v${APP_VERSION}. I dati salvati restano al sicuro nella cartella persistente del sistema." \
                --latest
            fi
          else
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" "${FILES[@]}" --clobber
            else
              gh release create "$TAG" "${FILES[@]}" \
                --title "METATRON CaricoStudio v${APP_VERSION}" \
                --notes "Versione desktop Windows METATRON CaricoStudio v${APP_VERSION}. I dati salvati restano al sicuro nella cartella persistente del sistema." \
                --target "$GITHUB_SHA" \
                --latest
            fi
          fi
