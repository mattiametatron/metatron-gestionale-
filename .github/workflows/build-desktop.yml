name: Build METATRON Desktop Software (.exe / .dmg / .AppImage)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-desktop:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_flag: --win
            artifact_name: METATRON-Desktop-Windows-EXE
          - os: macos-latest
            platform_flag: --mac
            artifact_name: METATRON-Desktop-macOS-DMG
          - os: ubuntu-latest
            platform_flag: --linux
            artifact_name: METATRON-Desktop-Linux-AppImage

    steps:
      - name: Checkout sorgenti
        uses: actions/checkout@v4

      - name: Verifica file desktop presenti
        shell: bash
        run: |
          if [ ! -f "desktop-app/electron-builder.json" ] || [ ! -f "scripts/build-desktop-server.mjs" ]; then
            echo "::error::Mancano i file desktop-app/ o scripts/build-desktop-server.mjs nel repository. Fai prima Push/Sincronizza da AI Studio su GitHub!"
            exit 1
          fi

      - name: Configura Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installa dipendenze
        run: npm install --legacy-peer-deps

      - name: Installa Electron e electron-builder
        run: npm install --save-dev --legacy-peer-deps electron electron-builder

      - name: Compila frontend e motore server interno
        run: |
          npm run build
          node scripts/build-desktop-server.mjs

      - name: Genera pacchetto Desktop installabile
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder ${{ matrix.platform_flag }} --config desktop-app/electron-builder.json --publish never

      - name: Carica pacchetto compilato (ZIP scaricabile)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
